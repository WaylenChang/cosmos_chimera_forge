name: Deploy Prompt Forge & Review Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel obsolete PR verification runs, including expensive Blender packages.
# Release deployment remains serialized by the deploy job's own concurrency.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify regression tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Includes the production build smoke test using a synthetic OAuth client ID.
      - name: Run all Node regression tests
        run: node --test tools/tests/*.cjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python scripts and anatomy routes
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -p 'test_anime3d*.py' -v

  blender-smoke:
    name: Verify real Blender GLB and animation round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgbm1 libgl1-mesa-dri xvfb
          blender --version
          blender -b --python-exit-code 3 --python-expr "import numpy; print('Blender NumPy', numpy.__version__)"
          ldconfig -p | grep 'libEGL.so.1'
      - name: Real Blender pipeline smoke tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_anime3d_blender_smoke.py' -v

  pages-build:
    name: Build and upload GitHub Pages artifact
    needs: [verify, blender-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build login-gated site
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: node tools/build-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy GitHub Pages
    needs: [pages-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Artifact upload can succeed before deploy-pages can query its metadata.
      # A dependent job plus readiness polling avoids this transient failure.
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and (.expired | not)) | .id' \
              | grep -qE '^[0-9]+$'; then
              echo "Pages artifact is visible to the Actions API."
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/24)"
            sleep 5
          done
          echo "::error::Pages artifact is still unavailable to the Actions API."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
